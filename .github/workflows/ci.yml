name: CI GameShelf

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-code:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le typage TypeScript
        run: npx tsc -b

      - name: Linter avec Oxlint
        run: npm run lint

      - name: Tester la compilation (Build Vite)
        run: npm run build